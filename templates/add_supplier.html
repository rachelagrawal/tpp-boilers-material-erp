{% extends "base.html" %}

{% block content %}

<h2>Add Supplier</h2>

<form method="POST">

    <input type="text"
           name="supplier_code"
           placeholder="Supplier Code">

    <br><br>

    <input type="text"
           name="supplier_name"
           placeholder="Supplier Name">

    <br><br>

    <input type="text"
           name="contact_person"
           placeholder="Contact Person">

    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone">

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email">

    <br><br>

    <input type="text"
           name="gst_number"
           placeholder="GST Number">

    <br><br>

    <textarea
        name="address"
        placeholder="Address">
    </textarea>

    <br><br>

    <button type="submit">
        Save Supplier
    </button>

</form>

{% endblock %}
