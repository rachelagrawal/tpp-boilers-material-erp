{% extends "base.html" %}

{% block content %}

<h2>Edit Item</h2>

<form method="POST">

    <div class="mb-3">

        <label>Item Code</label>

        <input
            type="text"
            name="item_code"
            class="form-control"
            value="{{ item.item_code }}"
            required>

    </div>

    <div class="mb-3">

        <label>Material Name</label>

        <input
            type="text"
            name="material_name"
            class="form-control"
            value="{{ item.material_name }}"
            required>

    </div>

    <div class="mb-3">

        <label>Category</label>

        <input
            type="text"
            name="category"
            class="form-control"
            value="{{ item.category }}">

    </div>

    <div class="mb-3">

        <label>Specification</label>

        <textarea
            name="specification"
            class="form-control"
            rows="3">{{ item.specification }}</textarea>

    </div>

    <div class="mb-3">

        <label>Unit of Measure (UOM)</label>

        <input
            type="text"
            name="uom"
            class="form-control"
            value="{{ item.uom }}">

    </div>

    <div class="mb-3">

        <label>Minimum Stock</label>

        <input
            type="number"
            step="0.01"
            name="min_stock"
            class="form-control"
            value="{{ item.min_stock }}">

    </div>

    <div class="mb-3">

        <label>Maximum Stock</label>

        <input
            type="number"
            step="0.01"
            name="max_stock"
            class="form-control"
            value="{{ item.max_stock }}">

    </div>

    <div class="mb-3">

        <label>Unit Price (₹)</label>

        <input
            type="number"
            step="0.01"
            name="unit_price"
            class="form-control"
            value="{{ item.unit_price }}">

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Update Item

    </button>

    <a
        href="/items"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
