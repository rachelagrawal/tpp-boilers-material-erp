{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Material Return</h2>

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            Return Material
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Material
                        </label>

                        <select
                            name="item_id"
                            class="form-select"
                            required
                        >

                            {% for item in items %}

                            <option value="{{ item.id }}">
                                {{ item.material_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0.01"
                            name="quantity"
                            class="form-control"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Return Date
                        </label>

                        <input
                            type="date"
                            name="return_date"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Reason
                        </label>

                        <input
                            type="text"
                            name="reason"
                            class="form-control"
                            placeholder="Reason for return"
                        >

                    </div>

                </div>

                <button
                    class="btn btn-success"
                    type="submit"
                >
                    Save Return
                </button>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

    <div class="card-header">
        Return History
    </div>

    <div class="card-body">

        <table class="table table-bordered table-hover">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Date</th>
                    <th>Material</th>
                    <th>Quantity</th>
                    <th>Reason</th>

                </tr>

            </thead>

            <tbody>

                {% for r in returns %}

                <tr>

                    <td>{{ r.id }}</td>

                    <td>
                        {{ r.return_date.strftime("%d-%b-%Y") }}
                    </td>

                    <td>
                        {{ r.item.material_name }}
                    </td>

                    <td>
                        {{ r.quantity }}
                    </td>

                    <td>
                        {{ r.reason }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</div>

{% endblock %}
