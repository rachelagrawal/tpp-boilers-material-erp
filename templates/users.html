{% extends "base.html" %}

{% block content %}

<h2>Users</h2>

<a href="/add-user" class="btn btn-success mb-3">
    Add User
</a>

<table class="table table-bordered">

    <tr>

        <th>Username</th>
        <th>Role</th>
        <th>Actions</th>

    </tr>

    {% for user in users %}

    <tr>

    <td>{{ user.username }}</td>

    <td>{{ user.role }}</td>

    <td>

    <a
        href="/edit-user/{{ user.id }}"
        class="btn btn-warning btn-sm">
        Edit
    </a>

    <a
        href="/delete-user/{{ user.id }}"
        class="btn btn-danger btn-sm"
        onclick="return confirm('Delete this user?');">
        Delete
    </a>

</td>

</tr>

    {% endfor %}

</table>

{% endblock %}
