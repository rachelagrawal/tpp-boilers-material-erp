{% extends "base.html" %}

{% block content %}

<h2>Goods Receipt Notes</h2>

<a href="/add-grn">
    Create GRN
</a>

<br><br>

<table class="table table-bordered">

<tr>
    <th>GRN Number</th>
    <th>PO</th>
    <th>Date</th>
</tr>

{% for grn in grns %}

<tr>
    <td>{{ grn.grn_number }}</td>
    <td>{{ grn.purchase_order.po_number }}</td>
    <td>{{ grn.received_date }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
