{% extends "base.html" %}

{% block content %}
<h2>Suppliers</h2>

<a href="/add-supplier">
    Add Supplier
</a>

<br><br>

<table style="border-collapse: collapse; width: 100%;">

<tr>
    <th style="padding:10px; border:1px solid black;">Code</th>
    <th style="padding:10px; border:1px solid black;">Name</th>
    <th style="padding:10px; border:1px solid black;">Contact</th>
    <th style="padding:10px; border:1px solid black;">Phone</th>
    <th style="padding:10px; border:1px solid black;">Actions</th>
</tr>

{% for supplier in suppliers %}

<tr>
    <td style="padding:10px; border:1px solid black;">
    {{ supplier.supplier_code }}
</td>
    <td style="padding:10px; border:1px solid black;">
    {{ supplier.supplier_name }}
</td>
    <td style="padding:10px; border:1px solid black;">
    {{ supplier.contact_person }}
</td>
    <td style="padding:10px; border:1px solid black;">
    {{ supplier.phone}}
</td>

    <td>
        <a href="/edit-supplier/{{ supplier.id }}">
            Edit
        </a>

        |

        <a href="/delete-supplier/{{ supplier.id }}">
            Delete
        </a>
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
